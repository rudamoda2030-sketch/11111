<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C0A" />
      <stop offset="50%" stop-color="#111914" />
      <stop offset="100%" stop-color="#183B2B" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A66A" />
      <stop offset="100%" stop-color="#397454" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#183B2B" stroke-width="8" opacity="0.6" />
  
  <!-- Central Cinema Film Reel / Play Icon -->
  <g transform="translate(136, 136)">
    <!-- Shield / Screen Border -->
    <rect width="240" height="240" rx="48" fill="#183B2B" stroke="url(#brand)" stroke-width="8" />
    <!-- Play Triangle -->
    <polygon points="95,70 175,120 95,170" fill="#F2F3EF" />
    <!-- Sparkle accent -->
    <circle cx="180" cy="65" r="12" fill="#C6A66A" />
  </g>
  <!-- Brand text -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#F2F3EF" letter-spacing="4">RUDA</text>
</svg>
